spring.application.name=seckill-gateway
# ========== 1. Knife4j 手动声明三个服务 ==========
knife4j.gateway.enabled=true
knife4j.gateway.strategy=manual

knife4j.gateway.routes[0].name=订单服务
knife4j.gateway.routes[0].service-name=order-service
knife4j.gateway.routes[0].url=/order/v3/api-docs

knife4j.gateway.routes[1].name=商品服务
knife4j.gateway.routes[1].service-name=product-service
knife4j.gateway.routes[1].url=/product/v3/api-docs

knife4j.gateway.routes[2].name=用户服务
knife4j.gateway.routes[2].service-name=user-service
knife4j.gateway.routes[2].url=/user/v3/api-docs

# ========== 2. 网关路由：三个文档接口 ==========
spring.cloud.gateway.routes[0].id=openapi-order
spring.cloud.gateway.routes[0].uri=lb://order-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/order/v3/api-docs
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=openapi-product
spring.cloud.gateway.routes[1].uri=lb://product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/product/v3/api-docs
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=openapi-user
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/user/v3/api-docs
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# ========== 3. 最关键：UI 资源路由（补全所有静态资源） ==========
spring.cloud.gateway.routes[3].id=knife4j-ui
spring.cloud.gateway.routes[3].uri=lb://order-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/doc.html,/webjars/**,/swagger-ui/**,/favicon.ico,/js/**,/css/**,/fonts/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

# ========== 4. 你的业务路由 ==========
spring.cloud.gateway.routes[4].id=user-route
spring.cloud.gateway.routes[4].uri=lb://user-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[5].id=product-route
spring.cloud.gateway.routes[5].uri=lb://product-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[6].id=order-route
spring.cloud.gateway.routes[6].uri=lb://order-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/orders/**,/api/seckill
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=0
# Agent 服务路由
spring.cloud.gateway.routes[7].id=agent-service
spring.cloud.gateway.routes[7].uri=lb://AgentTest
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/agent/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api/agent/(?<segment>.*), /ai/$\{segment}