server.port=8082
spring.application.name=order-service
spring.cloud.nacos.discovery.server-addr=localhost:8848
spring.datasource.url=jdbc:mysql://localhost:3306/shop?useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
spring.data.redis.host=localhost
## Sentinel 控制台地址（与启动 Dashboard 时的端口一致）
spring.cloud.sentinel.transport.dashboard=localhost:8858
#
# 客户端与 Dashboard 通信端口（默认 8719，如果被占用会自动递增）
spring.cloud.sentinel.transport.port=8719
#
## 关闭懒加载，让应用启动时就注册
spring.cloud.sentinel.eager=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
# 暴露 health 和 info 端点（安全考虑，不要用 * 暴露全部）
management.endpoints.web.exposure.include=health,info
# 显示健康检查的详细信息（比如数据库、Redis 等组件的状态）
management.endpoint.health.show-details=always
spring.cloud.nacos.discovery.metadata.version=v1.0
spring.cloud.nacos.discovery.metadata.env=dev
spring.cloud.nacos.discovery.metadata.region=chengdu
# ========== 链路追踪配置 ==========
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
# ========== 拉取 Nacos 配置（核心） ==========
spring.config.import[1]=nacos:common-db.properties?group=DEFAULT_GROUP
# ========== 拉取 Nacos 配置（核心） ==========
spring.config.import[0]=nacos:common-redis.properties?group=DEFAULT_GROUP
logging.level.com.alibaba.nacos.client.config=WARN
# ==========是否开启幂等校验 ==========
idempotent.enabled=true