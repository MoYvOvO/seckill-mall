name: Deploy Backend

on:
  push:
    branches: [ "main" ]
 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Deploy to Server via SCP & SSH
        uses: cross-the-world/ssh-scp-ssh-pipelines@latest
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USERNAME }}
          pass: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          scp: |
            ./seckill-user-service/target/*.jar => /root/
            ./seckill-product-service/target/*.jar => /root/
            ./seckill-order-service/target/*.jar => /root/
            ./seckill-gateway/target/*.jar => /root/
          last_ssh: |
            ps -ef | grep -E "user-service|product-service|order-service|gateway" | grep -v grep | awk '{print $2}' | xargs kill -9 || true
            cd /root
            nohup java -jar seckill-user-service-0.0.1-SNAPSHOT.jar > user.log 2>&1 &
            nohup java -jar seckill-product-service-0.0.1-SNAPSHOT.jar > product.log 2>&1 &
            nohup java -jar seckill-order-service-0.0.1-SNAPSHOT.jar > order.log 2>&1 &
            nohup java -jar seckill-gateway-0.0.1-SNAPSHOT.jar > gateway.log 2>&1 &
